name: InnovaTex Amlogic S905X4 Kernel Builder

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Pilih Target Build Kernel'
        required: true
        default: 'linux-7.3-mainline'
        type: choice
        options:
          - 'linux-7.3-mainline'
          - 'devmfc-lts-package'
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/**'
      - 'configs/**'
      - 'drivers/**'
      - 'firmware/**'
      - 'dtb_patches/**'
      - 'boot_scripts/**'

permissions:
  contents: write

jobs:
  build:
    name: Build InnovaTex Kernel for S905X4
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Install Build Dependencies & Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            bison flex libssl-dev bc kmod dosfstools mtools \
            libncurses5-dev libelf-dev ccache zip tar xz-utils zstd \
            curl wget binutils-aarch64-linux-gnu device-tree-compiler

      - name: 📦 Setup Output Directories
        run: |
          mkdir -p dist/rootfs/lib/modules
          mkdir -p dist/rootfs/lib/firmware/unisoc
          mkdir -p dist/boot
          mkdir -p build_tmp

      # =========================================================================
      # MODE 1: LINUX 7.3 MAINLINE COMPILE (ARCH NATIVE) (~10 Menit)
      # =========================================================================
      - name: 🚀 Compile Linux 7.3 Mainline for Amlogic S905X4
        if: ${{ github.event_name == 'push' || inputs.build_target == 'linux-7.3-mainline' }}
        run: |
          echo ">>> Downloading Linux Kernel 7.3 source from kernel.org..."
          wget -q -c https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.3.tar.xz
          tar -xf linux-7.3.tar.xz
          cd linux-7.3
          
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          echo ">>> Injecting S905X4 SC2 Device Tree & Patches..."
          # Salin DTB & DTS Devmfc
          cp ../dtb_patches/meson-sc2-ah212-generic.* arch/arm64/boot/dts/amlogic/ || true
          # Daftarkan ke Makefile dts amlogic
          echo 'dtb-$(CONFIG_ARCH_MESON) += meson-sc2-ah212-generic.dtb' >> arch/arm64/boot/dts/amlogic/Makefile
          
          # Setup Kernel Config
          if [ -f ../configs/config-6.18.55-meson64.config ]; then
            cp ../configs/config-6.18.55-meson64.config .config
            make ARCH=arm64 olddefconfig
          else
            make ARCH=arm64 defconfig
          fi
          
          echo ">>> Compiling Linux 7.3 Kernel Image & DTBs..."
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image dtbs modules
          
          KERNEL_VER=$(make -s ARCH=arm64 kernelrelease)
          echo "KERNEL_RELEASE=${KERNEL_VER}" >> $GITHUB_ENV
          
          # Install modul ke rootfs
          make ARCH=arm64 INSTALL_MOD_PATH=../dist/rootfs modules_install
          
          cd ..
          cp linux-7.3/arch/arm64/boot/Image dist/boot/vmlinuz-${KERNEL_VER}
          cp linux-7.3/.config dist/boot/config-${KERNEL_VER}
          
          mkdir -p dist/boot/dtb-${KERNEL_VER}/amlogic
          find linux-7.3/arch/arm64/boot/dts/amlogic/ -name "*.dtb" -exec cp {} dist/boot/dtb-${KERNEL_VER}/amlogic/ \;
          # Pastikan DTB ah212 generic ada
          cp dtb_patches/meson-sc2-ah212-generic.dtb dist/boot/dtb-${KERNEL_VER}/amlogic/ || true
          
          # Compile Unisoc drivers
          echo ">>> Compiling Driver Unisoc UWE5631 against Linux 7.3..."
          make -C "$(pwd)/linux-7.3" M="$(pwd)/drivers/unisoc/BSP" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CFG_AML_WIFI_DEVICE_UWE5621=y modules || true
          make -C "$(pwd)/linux-7.3" M="$(pwd)/drivers/unisoc/WIFI" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CFG_AML_WIFI_DEVICE_UWE5621=y modules || true
          make -C "$(pwd)/linux-7.3" M="$(pwd)/drivers/unisoc/BT/tty-sdio" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CFG_AML_WIFI_DEVICE_UWE5621=y modules || true
          
          TARGET_MOD_DIR="dist/rootfs/lib/modules/${KERNEL_VER}/kernel/drivers/net/wireless"
          mkdir -p "${TARGET_MOD_DIR}"
          find drivers/unisoc -name "*.ko" -exec cp {} "${TARGET_MOD_DIR}/" \;

      # =========================================================================
      # MODE 2: DEVMFC LTS PACKAGE FALLBACK
      # =========================================================================
      - name: ⚡ Mode Devmfc LTS Package (Fallback)
        if: ${{ inputs.build_target == 'devmfc-lts-package' }}
        run: |
          echo ">>> Menjalankan Fast Devmfc Package untuk Kernel 6.18.55-meson64..."
          cd build_tmp
          wget -q https://github.com/devmfc/debian-on-amlogic/releases/download/v6.18.55/linux-image-6.18.55-meson64_20261004_arm64.deb
          wget -q https://github.com/devmfc/debian-on-amlogic/releases/download/v6.18.55/linux-headers-6.18.55-meson64_20261004_arm64.deb
          dpkg-deb -x linux-image-6.18.55-meson64_20261004_arm64.deb pkg_img
          dpkg-deb -x linux-headers-6.18.55-meson64_20261004_arm64.deb pkg_hdr
          
          cp -r pkg_img/lib/modules/* ../dist/rootfs/lib/modules/
          KERNEL_VER="6.18.55-meson64"
          echo "KERNEL_RELEASE=${KERNEL_VER}" >> $GITHUB_ENV
          
          cp pkg_img/boot/vmlinuz-${KERNEL_VER} ../dist/boot/vmlinuz-${KERNEL_VER}
          cp pkg_img/boot/config-${KERNEL_VER} ../dist/boot/config-${KERNEL_VER} || cp ../configs/config-6.18.55-meson64.config ../dist/boot/config-${KERNEL_VER}
          
          mkdir -p ../dist/boot/dtb-${KERNEL_VER}/amlogic
          if [ -d pkg_img/boot/dtb-${KERNEL_VER} ]; then
            cp -r pkg_img/boot/dtb-${KERNEL_VER}/* ../dist/boot/dtb-${KERNEL_VER}/
          elif [ -d pkg_img/usr/lib/linux-image-${KERNEL_VER} ]; then
            cp -r pkg_img/usr/lib/linux-image-${KERNEL_VER}/* ../dist/boot/dtb-${KERNEL_VER}/
          fi
          
          cd ..
          HDR_DIR="$(pwd)/build_tmp/pkg_hdr/usr/src/linux-headers-${KERNEL_VER}"
          if [ -d "${HDR_DIR}" ]; then
            make -C "${HDR_DIR}" M="$(pwd)/drivers/unisoc/BSP" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CFG_AML_WIFI_DEVICE_UWE5621=y modules || true
            make -C "${HDR_DIR}" M="$(pwd)/drivers/unisoc/WIFI" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CFG_AML_WIFI_DEVICE_UWE5621=y modules || true
            make -C "${HDR_DIR}" M="$(pwd)/drivers/unisoc/BT/tty-sdio" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CFG_AML_WIFI_DEVICE_UWE5621=y modules || true
            TARGET_MOD_DIR="dist/rootfs/lib/modules/${KERNEL_VER}/kernel/drivers/net/wireless"
            mkdir -p "${TARGET_MOD_DIR}"
            find drivers/unisoc -name "*.ko" -exec cp {} "${TARGET_MOD_DIR}/" \;
          fi

      # =========================================================================
      # STEP: INJECT FIRMWARES & METADATA
      # =========================================================================
      - name: 📡 Inject Firmwares (Unisoc UWE5631 & Ralink RT5370)
        run: |
          echo ">>> Injecting Wireless Firmwares..."
          cp firmware/wcnmodem.bin dist/rootfs/lib/firmware/
          cp firmware/wcnmodem.bin dist/rootfs/lib/firmware/unisoc/
          cp firmware/rt2870.bin dist/rootfs/lib/firmware/
          cp firmware/*.bin dist/rootfs/lib/firmware/ || true

      # =========================================================================
      # STEP: GENERATE 256MB FAT32 BOOT PARTITION IMAGE (kernel_boot.fat)
      # =========================================================================
      - name: 💾 Generate Boot Partition FAT Image (kernel_boot.fat)
        run: |
          echo ">>> Creating 256MB FAT32 Boot Image..."
          dd if=/dev/zero of=kernel_boot.fat bs=1M count=256
          mkfs.vfat -F 32 -n "ALARMBOOT" kernel_boot.fat
          
          # Mount FAT image via loop
          sudo mkdir -p /mnt/fat_build
          sudo mount kernel_boot.fat /mnt/fat_build
          
          # Salin U-Boot scripts Devmfc
          sudo cp -r boot_scripts/* /mnt/fat_build/
          
          # Run depmod untuk update database modul
          sudo depmod -b dist/rootfs ${KERNEL_RELEASE} || true

          # Sesuaikan boot.config
          MAJOR=$(echo ${KERNEL_RELEASE} | cut -d. -f1)
          BRANCH=$(echo ${KERNEL_RELEASE} | cut -d. -f1-2)
          sudo sed -i "s/^majorbranch=.*/majorbranch=${MAJOR}.x.y/" /mnt/fat_build/boot.config || true
          sudo sed -i "s/^branch=.*/branch=${BRANCH}.y/" /mnt/fat_build/boot.config || true
          sudo sed -i "s/^release=.*/release=${KERNEL_RELEASE}/" /mnt/fat_build/boot.config || true
          sudo sed -i "s/^#*box=s905x4_generic.*/box=s905x4_generic/" /mnt/fat_build/boot.config || true
          
          # Salin Kernel & DTB
          sudo cp dist/boot/vmlinuz-${KERNEL_RELEASE} /mnt/fat_build/
          sudo cp dist/boot/config-${KERNEL_RELEASE} /mnt/fat_build/
          sudo cp -r dist/boot/dtb-${KERNEL_RELEASE} /mnt/fat_build/
          
          sudo sync
          sudo umount /mnt/fat_build
          echo ">>> kernel_boot.fat berhasil dirakit untuk Kernel ${KERNEL_RELEASE}!"

      # =========================================================================
      # STEP: BUNDLE ARTIFACTS INTO ZIP & TAR.GZ
      # =========================================================================
      - name: 📦 Packaging Release Archives
        run: |
          mkdir -p release_out
          
          echo ">>> Packaging modules & firmwares..."
          tar -czf release_out/modules_and_firmware_${KERNEL_RELEASE}.tar.gz -C dist/rootfs lib
          
          mv kernel_boot.fat release_out/kernel_boot_${KERNEL_RELEASE}.fat
          
          cd release_out
          cat << 'EOF' > README_FLASH.txt
          =======================================================
          InnovaTex Amlogic S905X4 Native Kernel Release
          =======================================================
          - Target SoC: Amlogic S905X4 (Advan AT01 / ah212 generic)
          - Boot Partition: kernel_boot_*.fat (Flash ke Partisi Boot via flash.py)
          - Rootfs Bundle: modules_and_firmware_*.tar.gz (Ekstrak ke / rootfs)
          - Firmware Termasuk:
            * wcnmodem.bin (Unisoc UWE5631 Wi-Fi + BT)
            * rt2870.bin (Ralink RT5370 USB Wi-Fi Monitor Mode)
          =======================================================
          EOF
          
          sha256sum * > SHA256SUMS.txt
          zip -9 -r ../innovatex-kernel-s905x4-${KERNEL_RELEASE}-complete.zip *
          cd ..

      - name: 🚀 Upload GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v${{ env.KERNEL_RELEASE }}-${{ github.run_number }}"
          name: "InnovaTex Linux ${{ env.KERNEL_RELEASE }} (Build #${{ github.run_number }})"
          body: |
            ## 🚀 InnovaTex Amlogic S905X4 Native Kernel Release
            - **Kernel Version:** `${{ env.KERNEL_RELEASE }}`
            - **SoC Target:** Amlogic S905X4 (Advan AT01 / ah212 generic)
            - **Wireless Drivers:** Unisoc UWE5631 & Ralink RT5370
            - **Firmware Included:** `wcnmodem.bin` & `rt2870.bin`
            - **Ready for `flash.py`!**
          files: |
            release_out/kernel_boot_${{ env.KERNEL_RELEASE }}.fat
            release_out/modules_and_firmware_${{ env.KERNEL_RELEASE }}.tar.gz
            innovatex-kernel-s905x4-${{ env.KERNEL_RELEASE }}-complete.zip
            release_out/SHA256SUMS.txt

      - name: 💾 Upload Artifacts (Actions Storage)
        uses: actions/upload-artifact@v4
        with:
          name: innovatex-kernel-s905x4-${{ env.KERNEL_RELEASE }}
          path: |
            release_out/*
            innovatex-kernel-s905x4-*.zip
